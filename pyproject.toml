[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miocard-bot"
version = "0.9.0"
description = "Telegram assistant for preliminary ECG image review with Anthropic Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.20,<4",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pypdf>=5,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
miocard-bot = "miocard.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/miocard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
